spring:
  application:
    name: vatsim-stats
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vatsim_stats}
    username: ${POSTGRES_USER:vatsim_stats}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  task:
    scheduling:
      pool:
        # Pinned to 1 deliberately: IngestionPoller.poll(), HealthAlertService.checkHealth(),
        # OurAirportsScheduledImportJob.run(), and PilotSessionTimeoutSweeper.closeTimedOutSessions()
        # all rely on running serially, never concurrently with each other -- see
        # PilotSessionTimeoutSweeper's class Javadoc for why this matters for its correctness.
        size: 1

vatsim:
  poll-interval-ms: 15000

monitoring:
  alert:
    to: ${ALERT_EMAIL_TO:ops@example.com}

server:
  port: 8080
