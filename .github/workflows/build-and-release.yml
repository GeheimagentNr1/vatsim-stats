name: Build and Release

on:
  push:
  pull_request:
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: timescale/timescaledb:latest-pg18
        env:
          POSTGRES_USER: vatsim_stats
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: vatsim_stats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vatsim_stats -d vatsim_stats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -Pproduction -DskipTests

      - name: Run tests
        run: mvn -B test

      - name: Smoke test - verify application starts
        env:
          POSTGRES_USER: vatsim_stats
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: vatsim_stats
          POSTGRES_PORT: 5432
        run: |
          java -Dvatsim.scheduling.enabled=false -jar app/target/vatsim-stats-app.jar &
          APP_PID=$!

          echo "Waiting for application to start..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200"; then
              echo "Application started successfully after ${i}s"
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done

          echo "Application failed to start within 60 seconds"
          kill $APP_PID 2>/dev/null
          exit 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and validate version from release name
        id: version
        run: |
          RELEASE_NAME="${{ github.event.release.name }}"
          if [[ "$RELEASE_NAME" =~ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            # Calculate next SNAPSHOT version (increment patch)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT_PATCH=$((PATCH + 1))
            echo "NEXT_VERSION=${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT" >> $GITHUB_OUTPUT
          else
            echo "Error: Release name must contain version in format X.Y.Z (e.g., v1.0.0 or 1.0.0)"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set release version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Commit release version
        run: |
          git add -A
          git commit -m "Release version ${{ steps.version.outputs.VERSION }}"

      - name: Move tag to release commit
        run: |
          git tag -f "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}" --force

      - name: Build release artifacts
        run: mvn -B package -Pproduction -DskipTests

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set next SNAPSHOT version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.NEXT_VERSION }} -DgenerateBackupPoms=false

      - name: Commit SNAPSHOT version
        run: |
          git add -A
          git commit -m "Prepare next development version ${{ steps.version.outputs.NEXT_VERSION }}"
          git push origin HEAD:${{ github.event.release.target_commitish }}
